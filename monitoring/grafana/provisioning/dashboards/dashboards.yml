# Grafana Dashboard Provisioning

apiVersion: 1

providers:
  - name: 'MediNote Dashboards'
    orgId: 1
    folder: 'MediNote-AI'
    folderUid: 'medinote'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
